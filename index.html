<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>OffGrid Connect</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="topo">
        <div>
            <h1>OffGrid Connect</h1>
            <p>Informação essencial. Mesmo sem conexão.</p>
        </div>

        <button class="botao-config" aria-label="Configurações">
            ⚙️
        </button>
    </header>

    <main>

        <section class="status">
            <span class="status-ponto"></span>

            <div>
                <strong id="status-conexao">Conectado</strong>
                <p>Última atualização: agora</p>
            </div>
        </section>

        <section class="boas-vindas">
            <h2>Olá! 👋</h2>
            <p>
                Acesse rapidamente suas informações importantes,
                mesmo quando estiver sem internet.
            </p>
        </section>

        <section class="menu">

            <button class="card">
                <span class="icone">🆘</span>
                <strong>Emergência</strong>
                <small>Acesso rápido</small>
            </button>

            <button class="card">
                <span class="icone">🏥</span>
                <strong>Saúde</strong>
                <small>Informações importantes</small>
            </button>

            <button class="card">
                <span class="icone">📍</span>
                <strong>Pontos</strong>
                <small>Locais importantes</small>
            </button>

            <button class="card">
                <span class="icone">📋</span>
                <strong>Conteúdo offline</strong>
                <small>Informações salvas</small>
            </button>

        </section>

        <button class="botao-adicionar">
            ➕ Adicionar informação
        </button>

    </main>

    <footer>
        <p>OffGrid Connect • Projeto HACK47</p>
    </footer>

    <script src="script.js"></script>

</body>
  </html>
